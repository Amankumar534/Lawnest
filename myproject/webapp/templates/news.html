{% load static %}
{% include "chatbot.html" %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>News</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/styles.css' %}">
  <link rel="icon" type="image/x-icon" href="{% static 'images/favicon.ico' %}">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  </head>
<body>
    <div class="text-center hero-about2">
      <h5 class="fw-bold text-warning pt-4">Blog</h5>
      <h1 class="fw-bold mb-3">News Updates</h1>
      <div class="container">
        <div class="row justify-content-center">
          {% for new in news %}
            <div class="col-lg-3 col-md-6 col-12 mt-4">
              <div class="card custom-card-height3">
                <img src="{{ new.image.url }}" width="100%" height="230px" alt="{{ new.title }}">
                <div class="card-body">
                  <h5 class="card-title fw-medium">{{ new.title }}</h5>
                  <p><i class="bi bi-calendar"></i> {{ new.date }}</p>
                  <a href="{{ new.link }}"><b>Read More</b></a>
                </div>
              </div>
            </div>
          {% endfor %}
        </div>
      </div> 
    </body>
</html>
